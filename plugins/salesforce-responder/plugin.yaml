name: salesforce-responder
version: 1.0.0
type: responder
api: ivar.plugin/v1
permissions:
  actions: [user.suspend, user.lock]
  network: ["*.my.salesforce.com:443"]
  secrets: [salesforce_instance_url, salesforce_token]
limits: { memory_mb: 128, cpu_ms_per_call: 50, timeout_ms: 2000 }
signature: sigstore
