name: release
# Push a tag such as v0.1.0. Everything is built from that commit and
# published under this repository: a GitHub Release with every SDK package,
# the binaries, the WebAssembly modules and the console, and container images
# in GitHub's registry at ghcr.io/jhmeel/ivar/<name>.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  REGISTRY: ghcr.io/jhmeel/ivar
jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" Cargo.toml
          grep -q "\"version\": \"$v\"" sdk/node/express/package.json
          grep -q "^version = \"$v\"" sdk/python/pyproject.toml
          grep -q "<version>$v</version>" sdk/java/pom.xml
          grep -q "<Version>$v</Version>" sdk/dotnet/Ivar/Ivar.csproj
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "wasm32-wasip1,wasm32-unknown-unknown" }
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: scripts/build-wasm.sh
      - name: Committed modules match the source
        run: git diff --exit-code --stat -- sdk/go/wasm sdk/python/ivar/_wasm replay-viewer/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            sdk/node/core-wasm
            sdk/php/wasm/ivar_core.wasm
            sdk/java/src/main/resources/ivar_core.wasm
            sdk/dotnet/Ivar/wasm/ivar_core.wasm

  packages:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wasm }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Node
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd sdk/node/core-wasm && npm pack --pack-destination ../../../dist)
          cd sdk/node/express
          npm ci && npm run build
          # The released package fetches the core module from the same release.
          npm pkg set "dependencies.@ivar/core-wasm=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ivar-core-wasm-$v.tgz"
          npm pack --pack-destination ../../../dist
      - name: Python
        run: pip install build && python -m build --outdir dist sdk/python
      - name: Java
        run: |
          v="${GITHUB_REF_NAME#v}"
          (cd sdk/java && mvn -B -q package -DskipTests)
          cp sdk/java/target/ivar-java-$v.jar dist/
          cp sdk/java/pom.xml dist/ivar-java-$v.pom
      - name: .NET
        run: dotnet pack sdk/dotnet/Ivar -c Release -o dist
      - name: PHP
        run: (cd sdk/php && zip -qr ../../dist/ivar-php-${GITHUB_REF_NAME#v}.zip composer.json src wasm)
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: dist }

  binaries:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "wasm32-wasip1" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.7" }
      - uses: actions/download-artifact@v4
        with: { name: wasm }
      - name: Build
        run: |
          v="${GITHUB_REF_NAME#v}"
          cargo build --release --locked -p ivar-server -p ivar-linux-agent -p ivar-network-sensor -p ivar-database-sensor \
            -p ivar-log-collector -p ivar-ai-gateway -p ivar-build-runner -p ivar-workstation-sensor
          cargo build --release --locked -p ivar-edge-filter --target wasm32-wasip1
          (cd go && go build -trimpath -o ../target/release/ivar-control ./cmd/ivar-control && go build -trimpath -o ../target/release/ivar-connector ./cmd/ivar-connector)
          d="ivar-$v-linux-x86_64"
          mkdir -p "dist/$d/bin"
          for b in ivar-core ivar-replay-library ivar-control ivar-connector ivar-linux-agent ivar-network-sensor ivar-database-sensor \
                   ivar-log-collector ivar-ai-gateway ivar-build-runner ivar-workstation-sensor; do cp "target/release/$b" "dist/$d/bin/"; done
          cp LICENSE NOTICE "dist/$d/"
          tar -C dist -czf "dist/$d.tar.gz" "$d" && rm -rf "dist/$d"
          cp target/wasm32-wasip1/release/ivar_edge_filter.wasm dist/
          cp sdk/php/wasm/ivar_core.wasm dist/
          (cd replay-viewer && zip -qr "../dist/ivar-console-$v.zip" index.html favicon.svg css js pkg vendor samples)
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: dist }

  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [core, control, connectors, sensors, edge-filter]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.target }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ matrix.target }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    needs: [packages, binaries, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: |
          rm -rf dist/sdk
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
