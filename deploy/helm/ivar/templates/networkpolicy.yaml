{{- if .Values.networkPolicy.enabled }}
# The core accepts ingest from sensors inside the cluster and nothing else;
# its egress is limited to DNS and the configured sinks (HTTPS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ivar-core
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: ivar-core } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: {} }]
      ports: [{ port: 8080 }, { port: 7443 }]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }, { port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ivar-control
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: ivar-control } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: {} }]
      ports: [{ port: 8090 }]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
{{- end }}
