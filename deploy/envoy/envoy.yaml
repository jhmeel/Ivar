# Envoy at the edge with Coraza and the OWASP Core Rule Set ahead of the IVAR
# filter (sections 7.2 and 8). The IVAR filter starts from no policy and
# fetches a signed bundle from ivar-control; until one verifies, admin routes
# fail closed and other routes pass within the fail open budget. Replace the
# REPLACE_WITH values with your policy keyring and redaction key, and set
# "mode" to enforce only after the observe phase exit test passes.
#
# Generated by deploy/envoy/generate.py and checked with envoy --mode validate.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
static_resources:
  listeners:
  - name: gateway
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: gateway
          use_remote_address: true
          xff_num_trusted_hops: 1
          route_config:
            virtual_hosts:
            - name: app
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                route:
                  cluster: app
          http_filters:
          - name: coraza
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              config:
                name: coraza
                root_id: coraza
                fail_open: true
                configuration:
                  '@type': type.googleapis.com/google.protobuf.StringValue
                  value: '{"directives_map": {"default": ["Include @demo-conf", "Include @crs-setup-conf", "SecAction \"id:900200,phase:1,nolog,pass,t:none,setvar:''tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE''\"", "SecRuleEngine On", "Include @owasp_crs/*.conf"]}, "default_directives": "default"}'
                vm_config:
                  runtime: envoy.wasm.runtime.v8
                  code:
                    local:
                      filename: /etc/envoy/coraza-proxy-wasm.wasm
          - name: ivar
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              config:
                name: ivar
                root_id: ivar
                fail_open: true
                configuration:
                  '@type': type.googleapis.com/google.protobuf.StringValue
                  value: '{"sensor_id": "edge-1", "mode": "observe", "redaction_key_hex": "REPLACE_WITH_REDACTION_KEY_HEX", "fail_open_budget_pct": 0.1, "admin_prefixes": ["/admin"], "max_body_bytes": 65536, "core_cluster": "ivar_core", "core_authority": "ivar-core", "control_cluster": "ivar_control", "control_authority": "ivar-control", "keyring": {"keys": {"policy-a": [{"key_id": "policy-a", "alg": "ed25519", "bytes": "REPLACE_WITH_POLICY_A_PUBLIC_HEX"}, ["policy"]], "policy-b": [{"key_id": "policy-b", "alg": "ed25519", "bytes": "REPLACE_WITH_POLICY_B_PUBLIC_HEX"}, ["policy"]]}}, "policy_bundle_base64": "", "tick_ms": 500, "max_outbox": 10000}'
                vm_config:
                  runtime: envoy.wasm.runtime.v8
                  code:
                    local:
                      filename: /etc/envoy/ivar_edge_filter.wasm
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: app
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: app
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: app
                port_value: 9000
  - name: ivar_core
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: ivar_core
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ivar-core
                port_value: 8080
  - name: ivar_control
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: ivar_control
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ivar-control
                port_value: 8090
