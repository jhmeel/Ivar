[package]
name = "ivar-windows-agent"
description = "Windows host agent (section 8): Windows Server processes, services, logons and network activity; can block processes and connections. Ships as a signed installer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ivar-contracts = { path = "../../crates/ivar-contracts" }
ivar-core = { path = "../../crates/ivar-core" }
ivar-sensor-kit = { path = "../../crates/ivar-sensor-kit" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_EventLog",
] }
