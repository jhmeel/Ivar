[package]
name = "ivar-workstation-sensor"
description = "Developer workstation sensor (section 8.3): macOS, Windows and Linux laptops. Installers, IDE extensions, repositories run locally and secret access; can block processes, extensions and outbound connections"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ivar-contracts = { path = "../../crates/ivar-contracts" }
ivar-core = { path = "../../crates/ivar-core" }
ivar-sensor-kit = { path = "../../crates/ivar-sensor-kit" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
sysinfo = "0.30"

[dev-dependencies]
ivar-sensor-kit = { path = "../../crates/ivar-sensor-kit", features = ["testing"] }
