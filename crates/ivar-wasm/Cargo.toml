[package]
name = "ivar-wasm"
description = "The decision core for JavaScript hosts (Node application SDK, replay viewer) through wasm-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ivar-api = { path = "../ivar-api" }
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
biscuit-auth = { version = "6", default-features = false, features = ["datalog-macro", "wasm"] }
getrandom = { version = "0.2", features = ["js"] }
