<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-label="IVAR architecture: sensors send events to ivar-core, which correlates, scores and responds; ivar-control signs the policy every component enforces"><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#86868b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d95926"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1a7f4b"/></marker>
  </defs><rect x="0" y="0" width="1280" height="860" rx="0" fill="#ffffff"/><rect x="32" y="30" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="66.44" y="30" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="32" y="38.61" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="66.44" y="38.61" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="40.61" y="47.22" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="57.83" y="47.22" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="40.61" y="55.83" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="57.83" y="55.83" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="49.22" y="64.44" width="7" height="7" rx="1.61" fill="#1d1d1f"/><rect x="49.22" y="38.61" width="7" height="7" rx="1.61" fill="#d95926"/><text x="88" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d1d1f">IVAR architecture</text><text x="88" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6e6e73">Sensors decide known attacks locally; the core correlates, scores and responds; every decision is sealed and replayable.</text><rect x="300" y="100" width="680" height="78" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><text x="320" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1d1d1f">ivar-control</text><text x="320" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e73">Control plane</text><circle cx="470" cy="122" r="3" fill="#d95926"/><text x="480" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#424245">Policy build: validate, replay, sign</text><circle cx="720" cy="122" r="3" fill="#d95926"/><text x="730" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#424245">Two key rule for weakening</text><circle cx="470" cy="148" r="3" fill="#d95926"/><text x="480" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#424245">TUF metadata · signed flags</text><circle cx="720" cy="148" r="3" fill="#d95926"/><text x="730" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#424245">Plugin registry · staged rollout</text><text x="32" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e73" letter-spacing="1">SENSORS  ·  where IVAR sees</text><rect x="32" y="214" width="292" height="58" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="48" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Applications</text><text x="48" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">SDKs: Node, Python, Go, Java, PHP, .NET</text><rect x="32" y="282" width="292" height="58" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="48" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Edge and gateways</text><text x="48" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Envoy, Istio: Coraza + CRS, then IVAR</text><rect x="32" y="350" width="292" height="58" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="48" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Hosts, network, databases</text><text x="48" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Host agents, flows, database audit</text><rect x="32" y="418" width="292" height="58" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="48" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">AI agents</text><text x="48" y="461" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">AI gateway for MCP tools and model APIs</text><rect x="32" y="486" width="292" height="58" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="48" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Build pipelines</text><text x="48" y="529" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Build runner, dataset and model load guard</text><rect x="32" y="554" width="292" height="58" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="48" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Cloud, identity, SaaS</text><text x="48" y="597" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">AWS, Azure, GCP, Okta, Entra, K8s</text><rect x="32" y="622" width="292" height="58" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="48" y="646" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Engines you run</text><text x="48" y="665" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Falco, Tetragon, Suricata adapters</text><rect x="32" y="694" width="292" height="52" rx="12" fill="#fbeee8" stroke="#d95926" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">In every sensor: local fast path (~1 ms)</text><text x="48" y="734" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#424245">last signed policy on disk · redaction at source</text><rect x="448" y="214" width="446" height="590" rx="16" fill="#f5f5f7" stroke="#d95926" stroke-width="1.5"/><text x="470" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#1d1d1f">ivar-core</text><text x="470" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Sharded by entity · the same engine runs in every SDK as Wasm</text><rect x="470" y="286" width="402" height="54" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><rect x="470" y="298" width="3" height="30" rx="1.5" fill="#d95926"/><text x="488" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Ingest</text><text x="488" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">OCSF over HTTP and gRPC; sequence gaps marked unobserved</text><line x1="671" y1="340" x2="671" y2="351" stroke="#86868b" stroke-width="1.5" marker-end="url(#a)"/><rect x="470" y="352" width="402" height="54" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><rect x="470" y="364" width="3" height="30" rx="1.5" fill="#d95926"/><text x="488" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Trust graph</text><text x="488" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Live edges between identities, workloads and data</text><line x1="671" y1="406" x2="671" y2="417" stroke="#86868b" stroke-width="1.5" marker-end="url(#a)"/><rect x="470" y="418" width="402" height="54" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><rect x="470" y="430" width="3" height="30" rx="1.5" fill="#d95926"/><text x="488" y="441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Detection</text><text x="488" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Eight methods: declared intent, deception, behaviour, more</text><line x1="671" y1="472" x2="671" y2="483" stroke="#86868b" stroke-width="1.5" marker-end="url(#a)"/><rect x="470" y="484" width="402" height="54" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><rect x="470" y="496" width="3" height="30" rx="1.5" fill="#d95926"/><text x="488" y="507" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Risk</text><text x="488" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Per entity on two timescales; independent sources counted</text><line x1="671" y1="538" x2="671" y2="549" stroke="#86868b" stroke-width="1.5" marker-end="url(#a)"/><rect x="470" y="550" width="402" height="54" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><rect x="470" y="562" width="3" height="30" rx="1.5" fill="#d95926"/><text x="488" y="573" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Policy and response ladder</text><text x="488" y="591" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Cedar decides; seven rungs from record to contain</text><line x1="671" y1="604" x2="671" y2="615" stroke="#86868b" stroke-width="1.5" marker-end="url(#a)"/><rect x="470" y="616" width="402" height="54" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><rect x="470" y="628" width="3" height="30" rx="1.5" fill="#d95926"/><text x="488" y="639" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Safeguards</text><text x="488" y="657" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Blast radius, protected entities, two source rule, breakers</text><line x1="671" y1="670" x2="671" y2="681" stroke="#86868b" stroke-width="1.5" marker-end="url(#a)"/><rect x="470" y="682" width="402" height="54" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><rect x="470" y="694" width="3" height="30" rx="1.5" fill="#d95926"/><text x="488" y="705" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Intent binding</text><text x="488" y="723" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Intent chains, consequence invariants, time locks</text><rect x="470" y="752" width="402" height="50" rx="10" fill="#e7f4ec" stroke="#1a7f4b" stroke-width="1"/><text x="488" y="773" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Evidence store</text><text x="488" y="791" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#424245">Hash chained, signed per shard: every verdict replays exactly</text><text x="960" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e73" letter-spacing="1">RESPONSES AND OUTPUTS</text><rect x="960" y="234" width="288" height="64" rx="12" fill="#ffffff" stroke="#d95926" stroke-width="1.5"/><text x="976" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Verdicts to sensors</text><text x="976" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">block · throttle · challenge · contain</text><rect x="960" y="312" width="288" height="64" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="976" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Responders</text><text x="976" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Signed plugins: Okta, Entra, AWS, GitHub</text><rect x="960" y="390" width="288" height="64" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="976" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Approvals</text><text x="976" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Operators confirm high consequence actions</text><rect x="960" y="468" width="288" height="64" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/><text x="976" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Sinks</text><text x="976" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">SIEM, OpenTelemetry, CAEP</text><rect x="960" y="546" width="288" height="64" rx="12" fill="#ffffff" stroke="#1a7f4b" stroke-width="1.5"/><text x="976" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f">Console and replay</text><text x="976" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73">Live view, verified replay, MP4, CSV, JSON</text><path d="M332 420 H440" stroke="#86868b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="386" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#424245" text-anchor="middle">events</text><text x="386" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e6e73" text-anchor="middle">OCSF, keyed hash</text><path d="M440 500 H332" stroke="#d95926" stroke-width="2" fill="none" marker-end="url(#b)"/><text x="386" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d95926" text-anchor="middle">verdicts</text><path d="M902 266 H952" stroke="#d95926" stroke-width="1.6" fill="none" marker-end="url(#b)"/><path d="M902 344 H952" stroke="#86868b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M902 422 H952" stroke="#86868b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M902 500 H952" stroke="#86868b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M880 777 H924 V578 H952" stroke="#1a7f4b" stroke-width="1.6" fill="none" marker-end="url(#g)"/><text x="932" y="681.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#1a7f4b">sealed evidence</text><path d="M294 139 H178 V184" stroke="#d95926" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/><path d="M671 182 V208" stroke="#d95926" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/><text x="681" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d95926">signed policy bundles</text><text x="32" y="838" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6e6e73">Observe by default: a sensor blocks only when its own mode and the verified signed policy both say enforce.</text></svg>
