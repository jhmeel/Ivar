<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IVAR Console</title>
<link rel="stylesheet" href="css/viewer.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.2 5.1 13.4 12 15 6.9-1.6 12-7.8 12-15V7L16 2Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 16h4l2-5 3 10 2-5h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <div class="brand-name">IVAR</div>
      <div class="brand-sub">Incident console</div>
    </div>
  </div>
  <div class="sources" role="tablist" aria-label="Source">
    <button type="button" class="seg on" data-source="replay" role="tab" aria-selected="true">Replay bundle</button>
    <button type="button" class="seg" data-source="live" role="tab" aria-selected="false">Live core</button>
  </div>
  <div class="loaders" id="replay-loaders">
    <label class="btn btn-ghost file">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h8l4 4v10H4z M12 3v4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span data-name="Bundle">Bundle</span>
      <input type="file" id="bundle-file" accept=".json" multiple>
    </label>
    <label class="btn btn-ghost file">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10H18M15 10v3M17.5 10v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-name="Keyring">Keyring</span>
      <input type="file" id="keyring-file" accept=".json">
    </label>
    <label class="field"><span>Redaction key</span><input type="text" id="redaction-key" placeholder="hex" spellcheck="false" autocomplete="off"></label>
    <button id="load-sample" type="button" class="btn btn-primary">Load sample</button>
  </div>
  <form class="loaders" id="live-loaders" hidden>
    <label class="field"><span>Core</span><input type="text" id="live-url" placeholder="same origin" spellcheck="false" autocomplete="off"></label>
    <label class="field"><span>Operator</span><input type="text" id="live-operator" placeholder="set by SSO" spellcheck="false" autocomplete="off"></label>
    <label class="field"><span>Roles</span><input type="text" id="live-roles" value="analyst" spellcheck="false" autocomplete="off"></label>
    <button id="live-connect" type="submit" class="btn btn-primary">Connect</button>
  </form>
  <div class="exports">
    <button id="export-mp4" type="button" class="btn btn-ghost" disabled title="Export the verified replay as an MP4 video">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h10v10H3zM13 9l4-2.5v7L13 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span id="export-label">MP4</span>
    </button>
    <button id="export-csv" type="button" class="btn btn-ghost" disabled title="Export the filtered events as CSV">CSV</button>
    <button id="export-json" type="button" class="btn btn-ghost" disabled title="Export the filtered frames as JSON">JSON</button>
    <button id="theme" type="button" class="btn btn-icon btn-ghost" aria-label="Toggle theme" title="Toggle light and dark">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<div id="seal" class="seal idle" role="status">
  <div class="seal-icon" aria-hidden="true"></div>
  <div class="seal-body">
    <div id="status" class="seal-title">Load a ReplayBundle, or connect to a live core</div>
    <div id="seal-checks" class="seal-checks">A replay renders only after it reproduces the live verdicts exactly, checked here in your browser. Live mode verifies the evidence hash chain on every poll.</div>
  </div>
  <dl id="seal-meta" class="seal-meta"></dl>
</div>

<div id="app" class="app" hidden>
  <nav class="sidebar" aria-label="Views">
    <a href="#/overview" data-view="overview"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Overview</span></a>
    <a href="#/events" data-view="events"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Events</span><b id="nav-events-count"></b></a>
    <a href="#/sessions" data-view="sessions"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12v9H8l-4 3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Sessions</span><b id="nav-sessions-count"></b></a>
    <a href="#/entities" data-view="entities"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 17c1-3.5 3.5-5 6-5s5 1.5 6 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Entities</span><b id="nav-entities-count"></b></a>
    <a href="#/graph" data-view="graph"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="15" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 5.5 13 6.8M6 7l1.6 6M13.8 8.6 9.5 13.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Graph</span></a>
  </nav>

  <main class="content">
    <div class="view-title" id="view-title"><h1></h1><p></p></div>
    <div id="cf-banner" class="banner" hidden></div>
    <section class="view" data-view="overview" aria-label="Overview"></section>
    <section class="view" data-view="events" aria-label="Events" hidden></section>
    <section class="view" data-view="sessions" aria-label="Sessions" hidden></section>
    <section class="view" data-view="entities" aria-label="Entities" hidden></section>
    <section class="view" data-view="graph" aria-label="Graph" hidden></section>
  </main>

  <aside id="drawer" class="drawer" aria-label="Frame detail" hidden>
    <header class="drawer-head">
      <div id="drawer-title" class="drawer-title"></div>
      <div class="drawer-nav">
        <button type="button" class="btn btn-icon btn-ghost" id="drawer-prev" aria-label="Previous frame" title="Previous (k)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5 7 10l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="btn btn-icon btn-ghost" id="drawer-next" aria-label="Next frame" title="Next (j)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="btn btn-icon btn-ghost" id="drawer-close" aria-label="Close detail" title="Close (Esc)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <div class="tabs" role="tablist" id="drawer-tabs"></div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <footer class="player" aria-label="Playback">
    <div class="transport">
      <button id="step-back" type="button" class="btn btn-icon" aria-label="Step back" title="Step back (left arrow)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4v12M16 4 8 10l8 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      <button id="play" type="button" class="btn btn-play" aria-label="Play" title="Play or pause (space)">
        <svg class="i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z" fill="currentColor"/></svg>
      </button>
      <button id="step" type="button" class="btn btn-icon" aria-label="Step forward" title="Step forward (right arrow)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 4v12M4 4l8 6-8 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
    </div>
    <label class="field compact"><span>Speed</span>
      <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="16">16×</option><option value="64">64×</option><option value="256">256×</option></select>
    </label>
    <div class="segmented" role="radiogroup" aria-label="Replay">
      <label><input type="radio" name="mode" value="live" checked><span>As recorded</span></label>
      <label><input type="radio" name="mode" value="counterfactual"><span>Counterfactual</span></label>
    </div>
    <label class="toggle" title="Limit every view to what had happened by the playhead"><input type="checkbox" id="follow"><span>As of playhead</span></label>
    <div class="scrub"><input id="scrub" type="range" min="0" value="0" aria-label="Frame"></div>
    <button id="fullscreen" type="button" class="btn btn-icon" aria-label="Full screen replay" title="Full screen replay (F)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="clock">
      <div><span class="clock-label">Frame</span><span id="clock-frame"></span></div>
      <div><span class="clock-label">Real elapsed</span><span id="clock-elapsed"></span></div>
    </div>
  </footer>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
